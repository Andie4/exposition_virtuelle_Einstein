<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatix</title>
    <script defer type="module" src="scripts/objets.js"></script>
    <link rel="stylesheet" href="styles/objets.css">
    <link rel="stylesheet" href="styles/styleExpo.css">


</head>
<body>


    <div>
        <audio autoplay loop src="media/objets.MP3" id="audio"></audio> 
    </div>

    <div class="flex align-center">
        <p class="absolute indications">Appuyé sur l'objet</p>
    </div>

    <div class="controls">
		<button class="audioBtn" type="button" id="buttonMute"><img src="media/volume_off.svg" alt="mute"></button>
		<button class="audioBtn" type="button" id="buttonDemute"><img src="media/volume_up.svg" alt="demute"></button>
	</div>
    
</body>
</html>
